spring:
  application:
    name: ats-system

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${REDIS_TIMEOUT:1s}
      repositories:
        enabled: false

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLED:true}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}

security:
  login-protection:
    trust-forwarded-headers: ${LOGIN_TRUST_FORWARDED_HEADERS:false}
    ip-failure-limit: ${LOGIN_IP_FAILURE_LIMIT:10}
    ip-window-seconds: ${LOGIN_IP_WINDOW_SECONDS:300}
    account-failure-limit: ${LOGIN_ACCOUNT_FAILURE_LIMIT:5}
    account-window-seconds: ${LOGIN_ACCOUNT_WINDOW_SECONDS:900}
  platform-admin:
    full-name: ${PLATFORM_ADMIN_FULL_NAME:Super Admin}
    email: ${PLATFORM_ADMIN_EMAIL:}
    password: ${PLATFORM_ADMIN_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:ats-system}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:30}

notifications:
  manager-review:
    enabled: ${MANAGER_REVIEW_MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@ats.local}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
