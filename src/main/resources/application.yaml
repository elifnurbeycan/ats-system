spring:
  application:
    name: ats-system

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLED:true}

  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

ats:
  storage:
    cv-path: ${ATS_CV_STORAGE_PATH:./data/uploads/cv}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}

security:
  login-protection:
    trust-forwarded-headers: ${LOGIN_TRUST_FORWARDED_HEADERS:false}
  platform-admin:
    full-name: ${PLATFORM_ADMIN_FULL_NAME:Super Admin}
    email: ${PLATFORM_ADMIN_EMAIL:}
  jwt:
    keycloak-issuer: ${KEYCLOAK_ISSUER:}
    keycloak-audience: ${KEYCLOAK_AUDIENCE:}
    keycloak-required: ${KEYCLOAK_REQUIRED:true}
  keycloak:
    admin:
      enabled: ${KEYCLOAK_ADMIN_API_ENABLED:false}
      server-url: ${KEYCLOAK_ADMIN_SERVER_URL:http://localhost:8081}
      realm: ${KEYCLOAK_ADMIN_REALM:master}
      client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:}
      client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
      target-realm: ${KEYCLOAK_REALM:ats}
      company-admin-role: ${KEYCLOAK_COMPANY_ADMIN_ROLE:COMPANY_ADMIN}

notifications:
  manager-review:
    enabled: ${MANAGER_REVIEW_MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@ats.local}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
