spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/ats_system
    username: postgres
    password: CHANGE_ME

  jpa:
    show-sql: true

  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

logging:
  level:
    com.yasarbilgi.ats: DEBUG
    org.hibernate.SQL: DEBUG

security:
  platform-admin:
    full-name: ${PLATFORM_ADMIN_FULL_NAME:Super Admin}
    email: ${PLATFORM_ADMIN_EMAIL:}
  jwt:
    keycloak-issuer: http://localhost:8081/realms/ats
    keycloak-audience: ""
    keycloak-required: true
  keycloak:
    admin:
      enabled: ${KEYCLOAK_ADMIN_API_ENABLED:false}
      server-url: ${KEYCLOAK_ADMIN_SERVER_URL:http://localhost:8081}
      realm: ${KEYCLOAK_ADMIN_REALM:ats}
      client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:ats-backend-admin}
      client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
      target-realm: ${KEYCLOAK_REALM:ats}
      company-admin-role: ${KEYCLOAK_COMPANY_ADMIN_ROLE:COMPANY_ADMIN}

notifications:
  manager-review:
    enabled: ${MANAGER_REVIEW_MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@example.com}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
