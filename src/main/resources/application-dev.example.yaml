cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/ats_system
    username: postgres
    password: CHANGE_ME

  jpa:
    show-sql: true

  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

logging:
  level:
    com.yasarbilgi.ats: DEBUG
    org.hibernate.SQL: DEBUG

security:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    reset-password-per-15-minutes: ${RATE_LIMIT_RESET_PASSWORD:5}
    user-creation-per-hour: ${RATE_LIMIT_USER_CREATION:20}
    company-creation-per-hour: ${RATE_LIMIT_COMPANY_CREATION:10}
    cv-upload-per-10-minutes: ${RATE_LIMIT_CV_UPLOAD:20}
    export-per-minute: ${RATE_LIMIT_EXPORT:20}
    write-per-minute: ${RATE_LIMIT_WRITE:120}
    read-per-minute: ${RATE_LIMIT_READ:600}
  platform-admin:
    full-name: ${PLATFORM_ADMIN_FULL_NAME:Super Admin}
    email: ${PLATFORM_ADMIN_EMAIL:}
    require-local-allowlist: ${PLATFORM_ADMIN_REQUIRE_LOCAL_ALLOWLIST:false}
  jwt:
    keycloak-issuer: ${KEYCLOAK_ISSUER:http://localhost:8081/realms/ats}
    keycloak-audience: ${KEYCLOAK_AUDIENCE:ats-backend}
  keycloak:
    admin:
      enabled: ${KEYCLOAK_ADMIN_API_ENABLED:false}
      server-url: ${KEYCLOAK_ADMIN_SERVER_URL:http://localhost:8081}
      realm: ${KEYCLOAK_ADMIN_REALM:ats}
      client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:ats-backend-admin}
      client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
      target-realm: ${KEYCLOAK_REALM:ats}
      company-admin-role: ${KEYCLOAK_COMPANY_ADMIN_ROLE:COMPANY_ADMIN}

notifications:
  manager-review:
    enabled: ${MANAGER_REVIEW_MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@example.com}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
